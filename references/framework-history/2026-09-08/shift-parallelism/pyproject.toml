[build-system]
# Targets the newest/accelerated stack only (vllm 0.26.0 / torch 2.11.0); the vllm-18
# extra installs an older vllm so its Arctic custom ops are ABI-mismatched (no accel).
requires = [
    "setuptools>=61.0",
    "wheel",
    "ninja",
    "cmake>=3.12",
    "nanobind==2.9.2",
    # uv pip install vllm==0.26.0 --dry-run 2>&1 | grep protobuf | sed 's/^ + //'
    # vllm 0.26.0 requires protobuf>=5.29.6
    "protobuf==5.29.6",
    "grpcio-tools",
    # Minimum torch version; should be the same as your env's torch
    # (vLLM 0.18.0 needs torch 2.10.0, vLLM 0.26.0 needs torch 2.11.0).
    "torch>=2.10.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "arctic_inference"
version = "0.3.1.dev0"
description = "Snowflake LLM inference library"

[project.scripts]
arctic_inference_server = "arctic_inference.server.cli:main"

[project.entry-points."vllm.general_plugins"]
arctic_inference = "arctic_inference.vllm.plugin:arctic_inference_plugin"

[tool.setuptools]
packages = [
    "arctic_inference",
    "arctic_inference.common",
    "arctic_inference.common.swiftkv",
    "arctic_inference.dynasor",
    "arctic_inference.op_builder",
    "arctic_inference.semi_persistence",
    "arctic_inference.suffix_decoding",
    "arctic_inference.vllm",
    "arctic_inference.vllm.swiftkv",
    "arctic_inference.vllm.attention",
    "arctic_inference.vllm.spec_dec",
    "arctic_inference.vllm.attention",
    "arctic_inference.embedding",
    "arctic_inference.server",
    "arctic_inference.server.weight_sync",
    "arctic_inference.csrc",
]

[tool.setuptools.package-dir]
"arctic_inference.csrc" = "csrc"

[tool.setuptools.package-data]
"arctic_inference.embedding" = ["arctic_inference/embedding/proto/*.proto"]

[project.optional-dependencies]
# Unpinned so vLLM resolves against the user's torch. The plugin only applies
# Arctic patches when the installed vLLM matches VLLM_PATCH_VERSION in
# arctic_inference/utils.py; on any other version vLLM still runs, just without
# Arctic acceleration.
vllm = [
    'vllm',
]

# Explicit-version install shortcuts. The user picks the pin to match their torch;
# only vllm==0.26.0 matches the supported pin, so ONLY it gets Arctic patches (any
# other version -> plugin skips, no acceleration).
vllm-26 = [
    'vllm==0.26.0',
]
# vllm-18 pulls torch 2.10.0 at runtime, but csrc/compiled ops still build against
# torch 2.11.0 (build-system, above), so the Arctic ops are ABI-mismatched under
# 2.10.0 and may not import -> server/BYO only. For native 2.10.0 ops, preinstall
# torch 2.10.0 and run `pip install -e .[vllm-18] --no-build-isolation`.
vllm-18 = [
    'vllm==0.18.0',
]

docs = [
    "sphinx>=8.1.3",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
]

test = [
    "lm_eval[api,ifeval]==0.4.8",
    "pandas",
    "pytest",
    "sentence_transformers"
]

embedding = [
    "vllm==0.9.2",
    # uv pip install vllm==0.9.2 --dry-run 2>&1 | grep protobuf | sed 's/^ + //'
    "protobuf==5.29.5",
]

server = [
    "ray",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "tqdm",
]

dynasor = [
    "rich",
    "prompt_toolkit",
    "pydantic",
    "datasets",
    "latex2sympy2",
    "transformers",
    "word2number",
]
