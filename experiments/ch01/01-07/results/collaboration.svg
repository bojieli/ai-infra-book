<text x="30" y="185" font-size="13" fill="#33475b">每次交换的张量：batch 32 × hidden 8192 × BF16 = 0.52 MB</text>
<text x="30" y="207" font-size="13" fill="#33475b">环形 all-reduce 每卡收发 2(P−1)/P × S = 0.79 MB；一步共 80 层 → 每卡 62.9 MB</text>
<text x="30" y="245" font-size="13" fill="#1d3557">scale-out 400 Gb/s：读取 11.22 ms ／ 计算 1.04 ms ／ 协作 1.66 ms → 主导 读取</text>
<text x="30" y="269" font-size="13" fill="#1d3557">scale-up 900 GB/s：读取 11.22 ms ／ 计算 1.04 ms ／ 协作 0.12 ms → 主导 读取</text>
