# GRPO Algorithm Configuration
defaults: "grpo_math_1B.yaml"

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 10
  val_at_start: false
  val_at_end: false
  max_val_samples: 256
  val_batch_size: 256
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
    max_generation_failures: 0

loss_fn:
  reference_policy_kl_penalty: 0.01
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  token_level_loss: true
  ratio_clip_c: null

checkpointing:
  enabled: false
  checkpoint_dir: "results/grpo_megatron"
  metric_name: "val:accuracy" # one of "val:" or "train:" followed by the metric name
  higher_is_better: true
  keep_top_k: 3
  save_period: 10
  checkpoint_must_save_by: null
  # pretrained_checkpoint: load weights from an existing megatron-bridge or
  # Megatron-LM checkpoint instead of converting from HuggingFace.
  # pretrained_checkpoint:
  #   path: "/path/to/checkpoint"  # iter dir or checkpoint root
  #   format: "megatron_bridge"    # or "megatron_lm"

policy:
  model_name: "Qwen/Qwen2.5-1.5B"
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
    chat_template_kwargs: null # can be used to pass kwargs to the chat template, e.g., enable_thinking=true
  train_global_batch_size: 512
  train_micro_batch_size: 4
  generation_batch_size: 64 # Only used when generating using megatron backend
  logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 512
  precision: "bfloat16"

  dtensor_cfg:
    enabled: false

  # See docs/design-docs/sequence-packing-and-dynamic-batching.md 
  # for more details on dynamic batching and sequence packing.
  #
  # We disable dynamic batching for Megatron as it is incompatible with Pipeline parallelism.
  # Instead, we use sequence packing.
  dynamic_batching:
    enabled: False
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"
    sequence_length_round: 64

  max_grad_norm: 1.0
  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}

  optimizer: null # remove default FSDP optimizer

  megatron_cfg:
    enabled: true
    force_reconvert_from_hf: False # Set to True to force reconvert of the model from Hugging Face
    empty_unused_memory_level: 1  # 1 is the minimum recommendation for RL since we almost always need to offload before beginning generation. Setting to 0 is faster, but you are more likely to run out of GPU memory.
    activation_checkpointing: false
    # Training CUDA Graph settings; modules and warmup are inactive with impl "none".
    cuda_graph_impl: "none"
    cuda_graph_modules: []
    cuda_graph_warmup_steps: 3
    # Offload specific module activations to CPU. Works for both dense and MoE
    # models and requires transformer_engine. Different from optimizer_cpu_offload,
    # which offloads optimizer states. On TE >= 2.10,
    # also set megatron_cfg.env_vars.NVTE_CPU_OFFLOAD_V1: "1".
    fine_grained_activation_offloading: false
    # Modules to offload when fine_grained_activation_offloading is true.
    # Common examples: ["core_attn", "attn_proj", "expert_fc1", "moe_act"].
    # Supported names depend on the pinned Megatron-LM version and are
    # validated by MCore. "attn_proj" requires "core_attn". See the latest
    # upstream module reference:
    # https://github.com/NVIDIA/Megatron-LM/blob/main/docs/user-guide/features/fine_grained_activation_offloading.md#offloadable-modules
    offload_modules: null
    # recompute_granularity controls activation checkpointing depth.
    # "full": recompute all activations (default, max memory savings).
    # "selective": recompute only specific modules (see recompute_modules).
    # Only takes effect when activation_checkpointing: true.
    recompute_granularity: "full"
    # Modules to selectively recompute when recompute_granularity="selective".
    # MCore options: ["core_attn", "moe_act", "layernorm", "mla_up_proj", "mlp", "moe", "shared_experts"].
    # Null defaults to ["core_attn"]. Full list and per-module constraints:
    # https://github.com/NVIDIA/Megatron-LM/blob/d30c3ae5469fe3f6a64d4fd2e63b6e7f7844ea81/megatron/core/transformer/transformer_config.py#L483
    # Use ["moe"] for MoE models to recompute expert activations only.
    recompute_modules: null
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    sequence_parallel: false
    freeze_moe_router: true
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none" # "seq_aux_loss" causes logprob error divergence for grpo
    moe_router_bias_update_rate: 0.0 # by default, disable bias updates for grpo
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    #gives ~20% training perf speedup with sequence packing
    apply_rope_fusion: True

    peft:
      enabled: false
      target_modules: []
      exclude_modules: []
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init_method: "xavier"
      lora_B_init_method: "zero"
      a2a_experimental: false
      lora_dtype: null
    
    optimizer:
      optimizer: "adam"
      lr: 5.0e-6
      min_lr: 5.0e-7
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"

      #adam
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      #sgd
      sgd_momentum: 0.9

      #distributed optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 1000
      lr_warmup_iters: 13
      lr_warmup_init: 5.0e-7

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

  generation:
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}

env:
  math:
    num_workers: 8
    math_verify_impl: "hf_math_verify"

logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: false  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "grpo-dev"
    name: "sj_megatron_1B"
  swanlab:
    project: "grpo-dev"
    name: "sj_megatron_1B"
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-dev"
    run_name: "sj_megatron_1B"
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 1
  num_nodes: 1
  segment_size: null  # Nodes per NVLink domain segment for topology-aware alignment; null to disable
