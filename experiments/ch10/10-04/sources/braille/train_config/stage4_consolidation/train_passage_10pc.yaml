### Stage 4 (S4) "Consolidation" - passage-level, r=10, 3 epochs
# Internal config name in the experiment log: 2345_v3/stage5_10pc
# This stage produces the released checkpoint. Resumes from the last (r10)
# sub-stage of the Stage 3 curriculum.

### model
model_name_or_path: saves/Qwen3-8B-Braille/stage3_curriculum/stage4_passage_train_br2zh_mix_r10_train/checkpoint-XXXX
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
bf16: true
deepspeed: train_config/deepspeed/ds_z3_config.json

### dataset
dataset_dir: data/cleaned_2345_v3
dataset: stage4_passage_train_br2zh_r10_train
template: qwen
cutoff_len: 2048
overwrite_cache: false
preprocessing_num_workers: 40
disable_shuffling: false

### output
output_dir: saves/Qwen3-8B-Braille/stage4_consolidation
logging_steps: 10
save_strategy: epoch
save_only_model: true
plot_loss: true

### train
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
ddp_timeout: 180000000
train_on_prompt: false
per_device_train_batch_size: 4
flash_attn: auto

### eval
eval_dataset: stage4_passage_train_br2zh_r10_val
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 0.1
do_eval: true
compute_accuracy: true
include_effective_tokens_per_second: true
