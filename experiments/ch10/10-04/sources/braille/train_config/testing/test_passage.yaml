### Passage-level test - the headline number (83.28 BLEU-4)
# Test set: passage-level, 10% tone retention.
# model_name_or_path must point at the Stage 4 checkpoint (or the released
# Hugging Face checkpoint). Inference in the paper used vLLM with
# temperature 0.95, top-p 0.7, top-k 50.

### model
model_name_or_path: saves/Qwen3-8B-Braille/stage4_consolidation/checkpoint-XXXX
trust_remote_code: true

### method
stage: sft
do_predict: true
finetuning_type: full

### dataset
dataset_dir: data/cleaned_2345_v3
eval_dataset: stage3_passage_train_br2zh_r100_test_r10
template: qwen
cutoff_len: 2048
preprocessing_num_workers: 40
dataloader_num_workers: 40

### output
output_dir: results/stage4_consolidation/passage_test
overwrite_output_dir: false
report_to: none

### evaluation
per_device_eval_batch_size: 4
predict_with_generate: true
ddp_timeout: 180000000
