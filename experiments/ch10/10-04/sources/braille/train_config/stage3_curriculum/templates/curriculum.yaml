### Stage 3 (S3) "Tone curriculum" - passages, 10 sub-stages, r=100 -> r=10, 1 epoch each
# Internal config name in the experiment log: 2345_v3/stage4_curriculum_0120
#
# This is a TEMPLATE, not a runnable config. run_with_cleanup.sh renders one YAML
# per tone level (r100, r90, ..., r10) and chains each sub-stage from the previous
# sub-stage's checkpoint, resetting the cosine schedule each time.

### model
model_name_or_path: {{checkpoint_path}}
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
bf16: true
deepspeed: train_config/deepspeed/ds_z3_config.json

### dataset
# Dataset keys are defined in data/cleaned_2345_v3/dataset_info.json
dataset_dir: data/cleaned_2345_v3
dataset: {{dataset_prefix}}_{{tone_pct}}_train
template: qwen
cutoff_len: 2048
overwrite_cache: false
preprocessing_num_workers: 40
disable_shuffling: false

### output
output_dir: {{output_base_dir}}/{{dataset_prefix}}_{{tone_pct}}_train
logging_steps: 10
save_strategy: epoch
save_only_model: true
plot_loss: true

### train
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 1.0
warmup_ratio: 0.05
ddp_timeout: 180000000
train_on_prompt: false
per_device_train_batch_size: 4
flash_attn: auto

### eval
eval_dataset: {{dataset_prefix}}_{{tone_pct}}_val
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 0.1
do_eval: true
compute_accuracy: true
include_effective_tokens_per_second: true
