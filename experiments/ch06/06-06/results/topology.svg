<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Helvetica,Arial,sans-serif">
<rect width="880" height="420" fill="#ffffff"/>
<text x="30" y="34" font-size="16" font-weight="600">割集带宽随端口数的变化（8 设备，每链路 50 GB/s）</text>
<rect x="270" y="90" width="320" height="22" fill="#3d5a80" opacity="0.85"/>
<text x="262" y="106" font-size="12" text-anchor="end" fill="#1d3557">单层交换（每设备 1 条上行）</text>
<text x="600" y="106" font-size="12" fill="#33475b">200 GB/s（4 条链路，最坏 2 跳）</text>
<rect x="270" y="126" width="160" height="22" fill="#c1666b" opacity="0.85"/>
<text x="262" y="142" font-size="12" text-anchor="end" fill="#1d3557">直连网格（每设备 2 端口）</text>
<text x="440" y="142" font-size="12" fill="#33475b">100 GB/s（2 条链路，最坏 4 跳）</text>
<rect x="270" y="162" width="240" height="22" fill="#c1666b" opacity="0.85"/>
<text x="262" y="178" font-size="12" text-anchor="end" fill="#1d3557">直连网格（每设备 3 端口）</text>
<text x="520" y="178" font-size="12" fill="#33475b">150 GB/s（3 条链路，最坏 2 跳）</text>
<rect x="270" y="198" width="320" height="22" fill="#c1666b" opacity="0.85"/>
<text x="262" y="214" font-size="12" text-anchor="end" fill="#1d3557">直连网格（每设备 4 端口）</text>
<text x="600" y="214" font-size="12" fill="#33475b">200 GB/s（4 条链路，最坏 2 跳）</text>
<rect x="270" y="234" width="560" height="22" fill="#c1666b" opacity="0.85"/>
<text x="262" y="250" font-size="12" text-anchor="end" fill="#1d3557">全互连直连（7 端口）</text>
<text x="840" y="250" font-size="12" fill="#33475b">350 GB/s（7 条链路，最坏 1 跳）</text>
<text x="30" y="390" font-size="13" fill="#33475b">增加交换层只把割集抬到较小一侧的上行链路数；增加直连链路直接抬高割集，但端口数是硬约束。</text>
</svg>