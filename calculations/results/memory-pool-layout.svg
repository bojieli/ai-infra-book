<text x="30" y="520" class="small">Blue: local data. Orange: remote snapshot for node 0. Gray: free capacity. No copy back to the full local node.</text>
<text x="30" y="555" class="small">Each read: 16 GiB. At 1/60, 1, 20 reads/s, payload demand is about 0.286, 17.18, 343.60 GB/s.</text>
<text x="30" y="590" class="small">Check link service, latency and transaction window separately. Dynamic KV updates and task compute are excluded.</text>
